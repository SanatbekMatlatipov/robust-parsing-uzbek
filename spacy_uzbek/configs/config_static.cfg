# ===========================================================================
# spaCy Training Config — Uzbek with Static Vectors (FastText)
# ===========================================================================
# Pipeline: tok2vec (HashEmbed + CNN) → tagger (UPOS) → morphologizer → parser
#
# This config trains a POS tagger and dependency parser using
# static FastText word vectors — the CPU-friendly baseline.
#
# Usage:
#   python -m spacy train spacy_uzbek/configs/config_static.cfg \
#       --output saved_models/spacy/static \
#       --paths.train spacy_uzbek/data/uz_combined.train.spacy \
#       --paths.dev spacy_uzbek/data/uz_combined.dev.spacy \
#       --paths.vectors wordvec/uz/spacy_vectors
# ===========================================================================

[system]
seed = 42
gpu_allocator = null

[nlp]
lang = "uz"
pipeline = ["tok2vec", "tagger", "morphologizer", "parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
tokenizer = {"@tokenizers": "spacy.Tokenizer.v1"}

[nlp.tokenizer]

[components]

# ---------- Tok2Vec (static embeddings) ----------

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = 128
attrs = ["NORM", "PREFIX", "SUFFIX", "SHAPE"]
rows = [5000, 2500, 2500, 2500]
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 128
depth = 4
window_size = 1
maxout_pieces = 3

# ---------- POS Tagger (UPOS) ----------

[components.tagger]
factory = "tagger"
label_smoothing = 0.0
neg_prefix = "!"
overwrite = false
scorer = {"@scorers": "spacy.tagger_scorer.v1"}

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null

[components.tagger.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "tok2vec"

# ---------- Morphologizer (UFeats) ----------

[components.morphologizer]
factory = "morphologizer"
extend = false
overwrite = true
label_smoothing = 0.0
scorer = {"@scorers": "spacy.morphologizer_scorer.v1"}

[components.morphologizer.model]
@architectures = "spacy.Tagger.v2"
nO = null

[components.morphologizer.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "tok2vec"

# ---------- Dependency Parser ----------

[components.parser]
factory = "parser"
learn_tokens = false
min_action_freq = 30
moves = null
update_with_oracle_cut_size = 100
scorer = {"@scorers": "spacy.parser_scorer.v1"}

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = ${components.tok2vec.model.encode.width}
upstream = "tok2vec"

# ===========================================================================
# Paths
# ===========================================================================

[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

# ===========================================================================
# Training
# ===========================================================================

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.WandbLogger.v3"
project_name = "spacy-uzbek"
remove_config_values = []
log_dataset_dir = "spacy_uzbek/data"
entity = null
run_name = "static_combined"

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 0.00000001

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
warmup_steps = 250
total_steps = 20000
initial_rate = 0.001

[training.score_weights]
tag_acc = 0.15
pos_acc = 0.15
morph_acc = 0.10
morph_per_feat = null
dep_uas = 0.25
dep_las = 0.25
dep_las_per_type = null
sents_p = null
sents_r = null
sents_f = 0.10

# ===========================================================================
# Corpora
# ===========================================================================

[corpora]

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

# ===========================================================================
# Initialization
# ===========================================================================

[initialize]
vocab_data = null
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
before_init = null
after_init = null
lookups = null

[initialize.components]

[initialize.tokenizer]
