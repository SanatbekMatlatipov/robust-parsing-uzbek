# ===========================================================================
# spaCy Training Config — Uzbek Transformer (TahrirchiBERT)
# ===========================================================================
# Pipeline: tok2vec (transformer) → tagger (UPOS) → morphologizer → parser
#
# This config trains a POS tagger and dependency parser using
# TahrirchiBERT contextual embeddings via spacy-transformers.
#
# Usage:
#   python -m spacy train spacy_uzbek/configs/config_transformer.cfg \
#       --output saved_models/spacy/transformer \
#       --paths.train spacy_uzbek/data/uz_combined.train.spacy \
#       --paths.dev spacy_uzbek/data/uz_combined.dev.spacy \
#       --gpu-id 0
# ===========================================================================

[system]
seed = 42
gpu_allocator = "pytorch"

[nlp]
lang = "uz"
pipeline = ["transformer", "tagger", "morphologizer", "parser"]
batch_size = 128
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
tokenizer = {"@tokenizers": "spacy.Tokenizer.v1"}

[nlp.tokenizer]

[components]

# ---------- Transformer (TahrirchiBERT) ----------

[components.transformer]
factory = "transformer"
max_batch_items = 4096
set_extra_annotations = {"@annotation_setters": "spacy-transformers.null_annotation_setter.v1"}

[components.transformer.model]
@architectures = "spacy-transformers.TransformerModel.v3"
name = "tahrirchi/tahrirchi-bert-base"
mixed_precision = false
tokenizer_config = {"use_fast": true}

[components.transformer.model.get_spans]
@span_getters = "spacy-transformers.strided_spans.v1"
window = 128
stride = 96

[components.transformer.model.grad_scaler_config]

[components.transformer.model.transformer_config]

# ---------- POS Tagger (UPOS) ----------

[components.tagger]
factory = "tagger"
label_smoothing = 0.0
neg_prefix = "!"
overwrite = false
scorer = {"@scorers": "spacy.tagger_scorer.v1"}

[components.tagger.model]
@architectures = "spacy.Tagger.v2"
nO = null

[components.tagger.model.tok2vec]
@architectures = "spacy-transformers.TransformerListener.v1"
grad_factor = 1.0
pooling = {"@layers": "reduce_mean.v1"}
upstream = "transformer"

# ---------- Morphologizer (UFeats) ----------

[components.morphologizer]
factory = "morphologizer"
extend = false
overwrite = true
label_smoothing = 0.0
scorer = {"@scorers": "spacy.morphologizer_scorer.v1"}

[components.morphologizer.model]
@architectures = "spacy.Tagger.v2"
nO = null

[components.morphologizer.model.tok2vec]
@architectures = "spacy-transformers.TransformerListener.v1"
grad_factor = 1.0
pooling = {"@layers": "reduce_mean.v1"}
upstream = "transformer"

# ---------- Dependency Parser ----------

[components.parser]
factory = "parser"
learn_tokens = false
min_action_freq = 30
moves = null
update_with_oracle_cut_size = 100
scorer = {"@scorers": "spacy.parser_scorer.v1"}

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.model.tok2vec]
@architectures = "spacy-transformers.TransformerListener.v1"
grad_factor = 1.0
pooling = {"@layers": "reduce_mean.v1"}
upstream = "transformer"

# ===========================================================================
# Paths
# ===========================================================================

[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

# ===========================================================================
# Training
# ===========================================================================

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 3
patience = 1600
max_epochs = 0
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.WandbLogger.v3"
project_name = "spacy-uzbek"
remove_config_values = []
log_dataset_dir = "spacy_uzbek/data"
entity = null
run_name = "transformer_combined"

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 0.00000001

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
warmup_steps = 250
total_steps = 20000
initial_rate = 0.00005

[training.score_weights]
tag_acc = 0.15
pos_acc = 0.15
morph_acc = 0.10
morph_per_feat = null
dep_uas = 0.25
dep_las = 0.25
dep_las_per_type = null
sents_p = null
sents_r = null
sents_f = 0.10

# ===========================================================================
# Corpora
# ===========================================================================

[corpora]

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 2000
gold_preproc = false
limit = 0
augmenter = null

# ===========================================================================
# Initialization
# ===========================================================================

[initialize]
vocab_data = null
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
before_init = null
after_init = null
lookups = null

[initialize.components]

[initialize.tokenizer]
